<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature's Platter</title>

  <!-- Tailwind -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="text-gray-900">

  <!-- =========================
           NAVBAR
      ========================== -->
  <header class="bg-white">
    <nav class="flex justify-between items-center container mx-auto px-4 sm:px-6 py-4">

      <!-- Logo -->
      <div class="flex items-center gap-2">
        <span class="text-green-600 text-2xl"><i class="fa-solid fa-leaf"></i></span>
        <div class="leading-tight">
          <p class="font-semibold text-lg -mb-1">nature's</p>
          <p class="font-semibold text-lg text-green-600">platter</p>
        </div>
      </div>

      <!-- Desktop menu -->
      <ul class="hidden lg:flex gap-10 items-center text-base font-medium">
        <li><a href="#" class="hover:text-green-600">Product</a></li>
        <li><a href="#" class="hover:text-green-600">Services</a></li>
        <li><a href="#" class="hover:text-green-600">Contact us</a></li>
      </ul>

      <!-- Desktop right icons -->
      <div class="hidden lg:flex gap-5 items-center">
        <span class="cursor-pointer text-lg"><i class="fa-solid fa-magnifying-glass"></i></span>
        <span class="cursor-pointer text-lg"><i class="fa-solid fa-cart-shopping"></i></span>
        <button
          class="border border-gray-300 rounded-full py-2 px-6 text-base font-medium hover:bg-gray-50">Login</button>
        <button
          class="rounded-full py-2 px-6 bg-green-600 hover:bg-green-700 text-base font-medium text-white">Register</button>
      </div>

      <!-- Mobile hamburger -->
      <button id="menu-btn" class="lg:hidden text-2xl" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </nav>

    <!-- Mobile menu panel -->
    <div id="mobile-menu" class="hidden lg:hidden px-4 pb-4">
      <ul class="flex flex-col gap-3 text-base font-medium">
        <li><a href="#" class="block py-1">Product</a></li>
        <li><a href="#" class="block py-1">Services</a></li>
        <li><a href="#" class="block py-1">Contact us</a></li>
      </ul>
      <div class="flex gap-4 items-center mt-3">
        <span><i class="fa-solid fa-magnifying-glass"></i></span>
        <span><i class="fa-solid fa-cart-shopping"></i></span>
        <button class="border border-gray-300 rounded-full py-2 px-4 text-sm flex-1">Login</button>
        <button class="rounded-full py-2 px-4 bg-green-600 text-white text-sm flex-1">Register</button>
      </div>
    </div>
  </header>

  <!-- =========================
           HERO
      ========================== -->
  <section class="bg-linear-to-b from-white to-[#f4f1ea] text-center pt-8 sm:pt-12 pb-6 px-4">
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold leading-tight max-w-3xl mx-auto">
      Freshness <span class="text-green-600">You Can</span><br>
      <span class="text-green-600">Count</span> On, Prices You'll Love!
    </h1>
    <p class="text-gray-500 text-sm sm:text-base max-w-xl mx-auto mt-4">
      Shop your daily essentials at unbeatable prices. From fresh produce to pantry
      staples, we've got you covered every day!
    </p>

    <img src="./assets/Hero Section 1.png" alt="Fresh vegetables in a paper bag"
      class="mx-auto mt-8 w-full max-w-md sm:max-w-lg md:max-w-2xl rounded-2xl object-cover">
  </section>
</body>

</html>
